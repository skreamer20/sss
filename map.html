<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивная карта</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>
<body>

<main>
 
 
    <section class="map-section">
         <!-- КНОПКА -->
    <div class="back">
        <a href="index.html" class="btn">← Вернуться на главную</a>
    </div>
    <div class="container">
         
        <h2 class="section-title"><span>Интерактивная</span> карта</h2>
          <div id="map"></div>
    </div>

    <div id="map"></div>
</section>
</main>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    var map = L.map('map').setView([53.9, 30.33], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Архитектура
    L.marker([53.894570, 30.332002]).addTo(map)
        .bindPopup("<b>Могилёвская ратуша</b><br>Архитектура");

         // Музей
    L.marker([53.908182, 30.338389]).addTo(map)
        .bindPopup("<b>Могилёвский областной художественный музей имени П.В. Масленикова</b><br>Музей");

    // Музей
    L.marker([53.899430, 30.338802]).addTo(map)
        .bindPopup("<b>Музей В.К. Бялыницкого-Бирули</b><br>Музей");

    // Музей
    L.marker([53.895111, 30.329693]).addTo(map)
        .bindPopup("<b>Могилевский областной краеведческий музей им. Е.Р. Романова</b><br>Музей");    

});
</script>

</body>
</html>
